name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/rhyton-properties-site-t48qrt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publishes the site to the gh-pages branch; GitHub Pages
      # auto-enables and serves it at netkenny1.github.io/Rhyton/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
